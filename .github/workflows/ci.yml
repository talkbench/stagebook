name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue: GitHub tests each queued PR on a temporary `merge_group` ref
  # (main + the PRs ahead of it). Without this trigger the required `CI Gate`
  # check never runs in the queue and PRs hang. On this event every test job
  # runs unconditionally (see the `|| github.event_name == 'merge_group'`
  # guards below) — skipping via the paths-filter here would let `CI Gate` go
  # green WITHOUT running the suite, merging the combined state untested.
  merge_group:

# Declared here rather than inherited from the org/repo default, which is
# `read` today but lives outside this file. Every job in this workflow runs
# untrusted PR code (`npm ci` executes lifecycle scripts from the PR's own
# lockfile), so state this read-only floor explicitly. `pull-requests: read`
# is required by dorny/paths-filter on PR events. The two jobs that upload
# artifacts (`package-vscode`, `test-ct`) escalate `actions: write` locally,
# scoped to just that job, since `upload-artifact@v4` needs it and this
# default must stay read-only for the rest.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      stagebook: ${{ steps.filter.outputs.stagebook }}
      viewer: ${{ steps.filter.outputs.viewer }}
      vscode: ${{ steps.filter.outputs.vscode }}
      ct: ${{ steps.filter.outputs.ct }}
      lint: ${{ steps.filter.outputs.lint }}
      action: ${{ steps.filter.outputs.action }}
      # Playwright version pinned in package-lock.json, used to build the
      # component-test container tag. See that job for why.
      playwright: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed so dorny/paths-filter can diff base vs HEAD reliably on push events.
          fetch-depth: 0
      # Skipped in the merge queue: there's no base/HEAD diff to compute, and
      # every job runs unconditionally there anyway. Its outputs are then empty
      # ('' != 'true'), so jobs run only via their `merge_group` guard.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            stagebook:
              - 'packages/stagebook/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            viewer:
              - 'apps/viewer/**'
              - 'packages/stagebook/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            vscode:
              - 'apps/vscode/**'
              - 'packages/stagebook/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            ct:
              - 'packages/stagebook/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            lint:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.json'
              - '.prettierrc'
              # All workflow files, so `format:check` guards them — a PR that
              # edits only a workflow (e.g. release-vscode.yml) still runs lint.
              - '.github/workflows/*.yml'
            action:
              - 'validate-action/**'
              - '.github/workflows/ci.yml'
      # Read the pinned Playwright version straight out of the lockfile so
      # the component-test container tag can be derived from it rather than
      # duplicated. Reads the lockfile directly — no `npm ci` needed, and
      # this job is already the first thing every other job waits on.
      # DELIBERATELY NOT gated on `github.event_name != 'merge_group'` like the
      # filter step above. In the merge queue test-ct runs unconditionally, so
      # an empty version here would make all 12 shards die at container init —
      # the #519 class of bug. Do not "fix" the inconsistency with its neighbour.
      - name: Read pinned Playwright version
        id: playwright-version
        run: |
          # Match on path suffix, not the exact hoisted key, so this keeps
          # working if npm ever nests the package under a workspace. Prints
          # empty rather than throwing when absent, so the guard below is the
          # thing that reports the failure.
          ver=$(node -e "
            const lock = require('./package-lock.json');
            const hit = Object.entries(lock.packages || {}).find(
              ([k]) => k === 'node_modules/@playwright/experimental-ct-react'
                || k.endsWith('/node_modules/@playwright/experimental-ct-react')
            );
            process.stdout.write(hit?.[1]?.version ?? '');
          ")
          # Strict shape check, not just non-empty. This value is interpolated
          # into `container.image` below, and the runner passes that through to
          # `docker` unquoted — whitespace would split into extra argv tokens.
          # A fork PR controls package-lock.json, so validate before trusting.
          # (The literal `-noble` suffix and the fixed mcr.microsoft.com prefix
          # already make an attacker-controlled pull unreachable; this makes it
          # true by construction rather than by luck. It also blocks a `\n` in
          # the JSON string from forging a second GITHUB_OUTPUT entry.)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected @playwright/experimental-ct-react version '$ver' in package-lock.json — expected a bare X.Y.Z"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Format
    needs: changes
    if: needs.changes.outputs.lint == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-stagebook:
    name: Unit Tests (stagebook)
    needs: changes
    if: needs.changes.outputs.stagebook == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w stagebook

  test-viewer:
    name: Unit Tests (viewer)
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w stagebook
      - run: npm test -w stagebook-viewer

  test-vscode:
    name: Unit Tests (vscode)
    needs: changes
    if: needs.changes.outputs.vscode == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w stagebook
      - run: npm test -w stagebook-vscode

  package-vscode:
    name: Package (vscode)
    needs: changes
    if: needs.changes.outputs.vscode == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # `actions/upload-artifact@v4` needs `actions: write` on the GITHUB_TOKEN
    # to create the artifact; the workflow-level default is `read`.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          # This job never needs the token after checkout (it only builds and
          # uploads an artifact), so don't leave it in .git/config while
          # `npm ci`/`vsce` run arbitrary dependency scripts.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `vsce package` runs the `vscode:prepublish` script (library build +
      # production bundle) before packaging, so this surfaces any packaging
      # regression on every PR that touches the extension — the drift that
      # used to be caught only by a human remembering to rebuild (#494).
      - run: npm run package -w stagebook-vscode
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: stagebook-vscode-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error

  test-ct:
    name: Component Tests (${{ matrix.browser }} ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.ct == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # Each shard runs ~1/4 of the suite at `--workers=1` in ~35-70s. Setup is
    # now dominated by the container pull (4 layers, 914 MB compressed —
    # ~32s measured on runner's CT job, but that is not a floor), and
    # "Initialize containers" counts against this budget. Raised 10 -> 15 with
    # the container switch: the sibling repos running this same image allow 20
    # (runner CT) and 15 (manager e2e), and a 10m cap plus a slow registry day
    # would reproduce the very failure class this change exists to remove.
    timeout-minutes: 15
    # `actions/upload-artifact@v4` (below, on failure) needs `actions: write`
    # on the GITHUB_TOKEN to create the artifact; the workflow-level default
    # is `read`.
    permissions:
      contents: read
      actions: write
    # Run inside Microsoft's official Playwright image, which ships all
    # three browsers AND their system deps pre-installed, so setup
    # touches the network only for `npm ci`.
    #
    # This replaced an `actions/cache` of `~/.cache/ms-playwright` plus a
    # per-run `npx playwright install-deps`. The cache only ever covered
    # browser *binaries*; system libs are OS packages and structurally
    # can't live there, so a cache hit was precisely the branch that ran
    # apt-get. Measured per shard on the run that motivated this change:
    #   chromium    9 packages /  21.1 MB of archives
    #   firefox    40 packages /  48.8 MB
    #   webkit    181 packages / 114 MB
    # times 4 shards each, plus 12x11.7 MB of index refresh — roughly
    # 875 MB pulled from azure.archive.ubuntu.com on EVERY run to install
    # what the image already contains, and twelve independent chances to
    # draw a stalled mirror. One did: a chromium shard hung 9m45s mid-
    # download with zero tests run and was killed by the 10m timeout.
    #
    # Cost is a ~32s image pull, so this is roughly minute-neutral (and
    # minutes are free here anyway — public repo, standard runners). The
    # win is removing apt from the hot path entirely. Same pattern as
    # talkbench/runner (playwright_component.yml, playwright_e2e.yml,
    # playwright_e2e_video.yml) and talkbench/manager (pr.yml), which
    # adopted it after ~6min webkit and ~11min chromium `--with-deps`
    # steps respectively.
    #
    # The tag is DERIVED from the `@playwright/experimental-ct-react`
    # version in package-lock.json rather than hardcoded: the image's
    # browser builds and the client library speak a versioned protocol,
    # and drift between them surfaces as an inscrutable launch failure.
    # Deriving it means a Playwright bump can't desync the two — a
    # dependabot PR moves both at once. If a bump ever lands before
    # Microsoft publishes the matching image, the job fails loudly at
    # pull time, which is the outcome we want.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # The image runs as root by default; pinning the runner's own UID
      # so checkout + npm steps don't trip over file-owner mismatches
      # with the host mount. (Chromium also refuses to launch as root
      # without --no-sandbox; this avoids needing that.)
      options: --user 1001
    strategy:
      # Run every (browser, shard) combination even when one fails so
      # the PR shows which engine(s) and which shard(s) broke at a
      # glance instead of failing fast on the first one.
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
        # Sharding strategy (#457): the webkit-on-Linux failures look
        # like a pointer-event scheduling race that surfaces when
        # Playwright's microtasks compete with parallel-worker CPU
        # contention on the 2-core GitHub runner. Locally on Mac the
        # same tests pass 448/448. The fix is twofold:
        #   1. `--workers=1` per job removes intra-job contention
        #      (the actual flake mitigation)
        #   2. `--shard=K/N` recovers parallelism across jobs (each
        #      shard gets its own runner, so total wall clock stays
        #      around max(shard time) rather than sum)
        # 4 shards per browser × 3 browsers = 12 jobs. Public repos on
        # standard ubuntu runners have no minute cap, so the extra
        # billable minutes are free.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          # The token is not needed after checkout, and this job runs
          # untrusted code from the PR (`npm ci` lifecycle scripts, then the
          # PR's own test files). Don't leave it in `.git/config` while that
          # runs. Same reasoning as the package-vscode job above.
          persist-credentials: false
      # Kept even though the image already ships Node 24 (verified: its build
      # args carry `NODE_VERSION=24`), for two reasons: `cache: npm` restores
      # ~/.npm for the `npm ci` below, and pinning here means the job's Node
      # version stops silently tracking whatever the next image tag ships.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No `playwright install` step: the image already has all three
      # browsers under /ms-playwright, which Playwright discovers via the
      # PLAYWRIGHT_BROWSERS_PATH env baked into it.
      # playwright-ct.config.ts keys BOTH `forbidOnly` and `retries: 2` off
      # `process.env.CI`. Actions injects CI=true into container jobs, but if
      # that ever stopped holding, a stray `test.only` would shrink a shard to
      # one test and still exit 0 — green with no coverage. Set it explicitly
      # so the suite's own guard rails don't depend on the execution context.
      - run: npx playwright test --config playwright-ct.config.ts --project=${{ matrix.browser }} --workers=1 --shard=${{ matrix.shard }}/4
        working-directory: packages/stagebook
        env:
          CI: "true"
      # The execution environment changed with the container switch, so keep
      # the HTML report + traces for anything that fails only in CI. Both
      # sibling repos do this; this job never did.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/stagebook/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  validate-action:
    name: Dogfood validate-action
    needs: changes
    if: needs.changes.outputs.action == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The action fetches + runs a network-downloaded package (npx), so scope
    # this job to read-only — it never needs to write anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Stage the fixtures as standalone study repos OUTSIDE this monorepo.
      # `npx`/`npm exec` resolve `stagebook` against the nearest project;
      # run from the repo root, npm matches the requested version to this
      # repo's own `packages/stagebook` workspace (same version) and tries to
      # run it locally — uninstalled → "not found" — instead of fetching from
      # npm. A real no-JS study repo has no such workspace, so validate from a
      # plain directory the same way a study repo's CI would.
      - name: Stage fixtures as standalone study repos
        run: |
          mkdir -p "$RUNNER_TEMP/study" "$RUNNER_TEMP/study-invalid"
          cp -R validate-action/fixtures/. "$RUNNER_TEMP/study/"
          cp -R validate-action/fixtures-invalid/. "$RUNNER_TEMP/study-invalid/"
      # Happy path: run the composite action end-to-end (setup-node + npx +
      # glob quoting + import resolution). Pins the validator to the current
      # release so the dogfood isn't coupled to unreleased schema changes.
      - name: Valid fixtures (text) → exit 0
        uses: ./validate-action
        with:
          version: "0.21.0"
          working-directory: ${{ runner.temp }}/study
          files: |
            **/*.stagebook.yaml
            **/*.prompt.md
      # JSON output branch (also skips the problem matcher).
      - name: Valid fixtures (json)
        uses: ./validate-action
        with:
          version: "0.21.0"
          format: json
          working-directory: ${{ runner.temp }}/study
          files: |
            **/*.stagebook.yaml
            **/*.prompt.md
      # --no-expand branch (raw syntax only).
      - name: Valid treatment (no-expand)
        uses: ./validate-action
        with:
          version: "0.21.0"
          no-expand: "true"
          working-directory: ${{ runner.temp }}/study
          files: "**/*.stagebook.yaml"
      # Negative case: the action must fail the job on a validation error.
      # `continue-on-error` lets the job survive so the next step can assert
      # the failure — this guards the exit-code propagation that is the whole
      # point of the action.
      - name: Invalid fixture → non-zero
        id: expect_fail
        continue-on-error: true
        uses: ./validate-action
        with:
          version: "0.21.0"
          working-directory: ${{ runner.temp }}/study-invalid
          files: "**/*.prompt.md"
      - name: Assert the invalid fixture failed validation
        if: steps.expect_fail.outcome != 'failure'
        run: |
          echo "Expected validate-action to fail on the invalid fixture, got '${{ steps.expect_fail.outcome }}'" >&2
          exit 1

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        changes,
        lint,
        test-stagebook,
        test-viewer,
        test-vscode,
        package-vscode,
        test-ct,
        build,
        validate-action,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled"
            echo "Upstream job results:"
            echo '${{ toJson(needs) }}'
            exit 1
          fi
